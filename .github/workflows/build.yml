name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build and run self-tests
        shell: powershell
        run: .\build.ps1 -OutputDirectory artifacts

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: CodexKeyboardScroll
          path: artifacts/CodexKeyboardScroll.exe
          if-no-files-found: error
